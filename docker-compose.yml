services:
  gamification-service:
    container_name: gamification-service
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "9004:9004"
    volumes:
      - ./:/app
      - ./.env:/app/.env:ro
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 9004 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: gamification-postgres
    environment:
      POSTGRES_USER: gamification_user
      POSTGRES_PASSWORD: gamification_password
      POSTGRES_DB: gamification_db
    ports:
      - "5434:5432"
    volumes:
      - gamification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamification_user -d gamification_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gamification-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gamification_postgres_data:
