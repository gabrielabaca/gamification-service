services:
  gamification-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Gamification Service API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-false}
      PORT: ${PORT:-9004}
      API_PORT: ${PORT:-9004}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      POINTS_TO_COINS_RATE: ${POINTS_TO_COINS_RATE:-100}
    ports:
      - "${PORT:-9004}:${PORT:-9004}"
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-9004}"
    restart: unless-stopped
